# Builds the Vite site and publishes it to GitHub Pages on every push to main.
#
# One-time setup in the GitHub repository:
#   1. Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
#   2. Settings -> Secrets and variables -> Actions -> "Variables" tab, add:
#        VITE_SUPABASE_URL              (your Supabase project URL)
#        VITE_SUPABASE_PUBLISHABLE_KEY  (the publishable / anon key -- never the secret key)
#      Without them the site still deploys, showing its built-in content.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # also allows a manual run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes one still queued.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        # The site lives at https://<user>.github.io/<repo>/, so every URL is
        # built relative to /<repo>/.
        run: npx vite build --base=/${{ github.event.repository.name }}/

      # GitHub Pages serves 404.html for any path it has no file for. Making
      # that the app itself lets /admin and /projects load and route in the
      # browser instead of showing GitHub's "page not found".
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
